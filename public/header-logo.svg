<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 56">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <clipPath id="badge">
      <rect x="0" y="4" width="48" height="48" rx="11"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <rect x="0" y="4" width="48" height="48" rx="11" fill="#0f172a"/>
  <rect x="0" y="4" width="48" height="48" rx="11" fill="none" stroke="#1e293b" stroke-width="1"/>
  <!-- Accent bar -->
  <rect x="0" y="4" width="48" height="2.5" fill="url(#g)" clip-path="url(#badge)"/>

  <!-- RC text in badge -->
  <text x="24" y="36"
    text-anchor="middle"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="800"
    font-size="24"
    letter-spacing="-1.5"
    fill="url(#g)">RC</text>

  <!-- "rcormier.dev" wordmark -->
  <text y="34"
    font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-weight="700"
    font-size="20"
    letter-spacing="-0.3">
    <tspan x="60" fill="#f1f5f9">rcormier</tspan><tspan fill="#6366f1">.dev</tspan>
  </text>
</svg>
